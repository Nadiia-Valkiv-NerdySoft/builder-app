<div class="lead-form-container">
  <h2>{{ title }}</h2>

  <form [formGroup]="leadForm" (ngSubmit)="onSubmit()" class="lead-form">
    <div>
      <input
        type="email"
        formControlName="email"
        [placeholder]="emailPlaceholder"
      />
      <div
        class="error-message"
        *ngIf="leadForm.get('email')?.invalid && leadForm.get('email')?.touched"
      >
        Email is required and must be valid.
      </div>
    </div>

    <div>
      <input
        type="text"
        inputmode="numeric"
        pattern="\d{5}"
        formControlName="zip"
        [placeholder]="zipPlaceholder"
        required
      />
      <div
        class="error-message"
        *ngIf="leadForm.get('zip')?.invalid && leadForm.get('zip')?.touched"
      >
        ZIP must be 5 digits.
      </div>
    </div>

    <button type="submit" [disabled]="leadForm.invalid">
      {{ buttonText }}
    </button>
  </form>
</div>
